<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#05235E"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="white"/>
  <text x="460" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#05235E">Hardware access through SAGateway</text>

  <rect x="55" y="145" width="185" height="120" rx="10" fill="#eef3fb" stroke="#05235E" stroke-width="2"/>
  <text x="147" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">System</text>
  <text x="147" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">State / Action spaces</text>

  <rect x="345" y="115" width="230" height="180" rx="12" fill="#f2eefa" stroke="#7d5ba6" stroke-width="2"/>
  <text x="460" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#49366b">SAGateway</text>
  <text x="460" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">EventManager</text>
  <text x="460" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">maps system dimensions to</text>
  <text x="460" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">sensors and actuators</text>

  <rect x="680" y="85" width="180" height="95" rx="10" fill="#e8f7f7" stroke="#4a9ca1" stroke-width="2"/>
  <text x="770" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#286c70">Sensors</text>
  <text x="770" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">read real-world values</text>

  <rect x="680" y="240" width="180" height="95" rx="10" fill="#fff1df" stroke="#c98b3c" stroke-width="2"/>
  <text x="770" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8b5a1e">Actuators</text>
  <text x="770" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">write control values</text>

  <line x1="240" y1="180" x2="345" y2="180" stroke="#05235E" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="292" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Action</text>

  <line x1="345" y1="235" x2="240" y2="235" stroke="#05235E" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="292" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">State</text>

  <line x1="680" y1="132" x2="575" y2="160" stroke="#05235E" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="625" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">sensor values</text>

  <line x1="575" y1="255" x2="680" y2="287" stroke="#05235E" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="625" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">actuator values</text>

  <text x="460" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">The gateway isolates hardware communication from the system model.</text>
</svg>