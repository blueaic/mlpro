<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">MLPro-OA-Control architecture</title>
  <desc id="desc">Simplified closed-loop control architecture showing an online-adaptive controller between control error and controlled system, with controller and model foundations and RL-based specialization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#05235E"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#05235E; stroke-width:2; rx:12; ry:12; }
    .soft { fill:#f5f7fb; stroke:#05235E; stroke-width:1.6; rx:10; ry:10; }
    .title { font:700 20px Arial, sans-serif; fill:#05235E; }
    .text { font:15px Arial, sans-serif; fill:#1f2937; }
    .small { font:13px Arial, sans-serif; fill:#374151; }
    .arrow { stroke:#05235E; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>

  <rect class="soft" x="25" y="112" width="150" height="70"/>
  <text class="title" x="100" y="140" text-anchor="middle">Control Error</text>
  <text class="small" x="100" y="164" text-anchor="middle">setpoint - feedback</text>

  <rect class="box" x="245" y="78" width="250" height="138"/>
  <text class="title" x="370" y="112" text-anchor="middle">OAController</text>
  <text class="text" x="370" y="140" text-anchor="middle">Controller + Model</text>
  <text class="small" x="370" y="166" text-anchor="middle">compute control variable</text>
  <text class="small" x="370" y="188" text-anchor="middle">adapt during operation</text>

  <rect class="soft" x="565" y="112" width="190" height="70"/>
  <text class="title" x="660" y="140" text-anchor="middle">Controlled System</text>
  <text class="small" x="660" y="164" text-anchor="middle">plant / process</text>

  <path class="arrow" d="M175 147 H238"/>
  <path class="arrow" d="M495 147 H558"/>
  <path class="arrow" d="M755 147 H845 V260 H100 V190"/>
  <text class="small" x="811" y="134" text-anchor="middle">feedback</text>

  <rect class="soft" x="245" y="240" width="250" height="48"/>
  <text class="text" x="370" y="269" text-anchor="middle">OAControllerRL / RLPID</text>
  <path class="arrow" d="M370 239 V220"/>
</svg>
