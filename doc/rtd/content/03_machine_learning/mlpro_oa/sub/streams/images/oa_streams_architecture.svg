  <rect x="100" y="410" width="260" height="62" rx="15" fill="#FFFFFF" stroke="#A6B3C9" stroke-width="2"/>
  <text x="230" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#05235E">OAStreamTask</text>

