<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">MLPro-OA-Streams architecture overview</title>
  <desc id="desc">BF-Streams and BF-ML converge into OA-Streams, which provides adaptive tasks, workflows, scenarios and shared runtime semantics.</desc>
