<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OA-Streams functional landscape</title>
  <desc id="desc">A simplified OA-Streams processing landscape from stream input through adaptive preprocessing, cluster analysis and change detection, with statistics and observation as complementary functions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#05235E"/>
    </marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6A4FB3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" rx="24" fill="#F7F9FC"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#05235E">Functional landscape of MLPro-OA-Streams</text>

  <rect x="55" y="125" width="170" height="90" rx="16" fill="#FFFFFF" stroke="#05235E" stroke-width="2.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Data Stream</text>
  <text x="140" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">new + obsolete instances</text>

  <rect x="285" y="105" width="215" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="392" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Adaptive</text>
  <text x="392" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Preprocessing</text>
  <text x="392" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">Boundaries · MinMax · ZTrans</text>

  <rect x="560" y="105" width="215" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="667" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Online Cluster</text>
  <text x="667" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Analysis</text>
  <text x="667" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">Clusters · Properties · Events</text>

  <rect x="835" y="105" width="250" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="960" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Change Detection</text>
  <text x="960" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#25324A">Anomalies · Drifts</text>
  <text x="960" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">instance-based + cluster-based</text>

  <line x1="225" y1="170" x2="275" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="170" x2="550" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="775" y1="170" x2="825" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="285" y="315" width="300" height="105" rx="18" fill="#FFFFFF" stroke="#A6B3C9" stroke-width="2"/>
  <text x="435" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Online Statistics</text>
  <text x="435" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#25324A">e.g. MovingAverage</text>
  <text x="435" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#25324A">incremental + reverse updates + renormalization</text>

  <rect x="665" y="315" width="300" height="105" rx="18" fill="#F4EEFF" stroke="#6A4FB3" stroke-width="2.5"/>
  <text x="815" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5C419E">Observation &amp; Helpers</text>
  <text x="815" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4B3B68">OA · Change · Cluster observers</text>
  <text x="815" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B3B68">monitor events without changing processing logic</text>

  <line x1="392" y1="235" x2="392" y2="305" stroke="#05235E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="667" y1="235" x2="760" y2="305" stroke="#6A4FB3" stroke-width="2.5" marker-end="url(#eventArrow)"/>
  <line x1="960" y1="235" x2="870" y2="305" stroke="#6A4FB3" stroke-width="2.5" marker-end="url(#eventArrow)"/>

  <text x="600" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#596579">All elements can be composed inside one OAStreamWorkflow and combined with non-adaptive BF-Streams tasks.</text>
</svg>