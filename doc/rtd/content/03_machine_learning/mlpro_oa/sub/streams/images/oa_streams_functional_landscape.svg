<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">OA-Streams functional landscape</title>
  <desc id="desc">A simplified OA-Streams processing landscape with adaptive preprocessing, online cluster analysis and change detection as main domains. Anomaly and drift detection are subordinate to change detection. Online statistics and observation are grouped as auxiliary functionality.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#05235E"/>
    </marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6A4FB3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="24" fill="#F7F9FC"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#05235E">Functional landscape of MLPro-OA-Streams</text>

  <rect x="55" y="125" width="170" height="90" rx="16" fill="#FFFFFF" stroke="#05235E" stroke-width="2.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Data Stream</text>
  <text x="140" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">new + obsolete instances</text>

  <rect x="285" y="105" width="215" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="392" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Adaptive</text>
  <text x="392" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Preprocessing</text>
  <text x="392" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">Boundaries · MinMax · ZTrans</text>

  <rect x="560" y="105" width="215" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="667" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Online Cluster</text>
  <text x="667" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Analysis</text>
  <text x="667" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#25324A">Clusters · Properties · Events</text>

  <rect x="835" y="105" width="250" height="130" rx="18" fill="#EAF0FA" stroke="#05235E" stroke-width="2.5"/>
  <text x="960" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#05235E">Change Detection</text>
  <rect x="862" y="160" width="92" height="42" rx="10" fill="#FFFFFF" stroke="#A6B3C9" stroke-width="1.5"/>
  <text x="908" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#25324A">Anomaly</text>
  <rect x="968" y="160" width="92" height="42" rx="10" fill="#FFFFFF" stroke="#A6B3C9" stroke-width="1.5"/>
  <text x="1014" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#25324A">Drift</text>
  <text x="960" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#596579">specialized detection domains</text>

  <line x1="225" y1="170" x2="275" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="170" x2="550" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="775" y1="170" x2="825" y2="170" stroke="#05235E" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="285" y="315" width="680" height="155" rx="20" fill="#FFFFFF" stroke="#A6B3C9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="625" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#596579">Auxiliary Functionality</text>

  <rect x="320" y="365" width="270" height="80" rx="16" fill="#F7F9FC" stroke="#A6B3C9" stroke-width="1.8"/>
  <text x="455" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#05235E">Online Statistics</text>
  <text x="455" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#25324A">e.g. MovingAverage</text>

  <rect x="660" y="365" width="270" height="80" rx="16" fill="#F4EEFF" stroke="#6A4FB3" stroke-width="1.8"/>
  <text x="795" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5C419E">Observation &amp; Helpers</text>
  <text x="795" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4B3B68">OA · Change · Cluster observers</text>

  <line x1="392" y1="235" x2="430" y2="305" stroke="#05235E" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="667" y1="235" x2="720" y2="305" stroke="#6A4FB3" stroke-width="2.2" marker-end="url(#eventArrow)"/>
  <line x1="960" y1="235" x2="820" y2="305" stroke="#6A4FB3" stroke-width="2.2" marker-end="url(#eventArrow)"/>

  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#596579">Main processing domains can be complemented by auxiliary functionality inside the same OAStreamWorkflow.</text>
</svg>