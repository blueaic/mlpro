## -- Workflow: ci.yml
## -------------------------------------------------------------------------------------------------
## -- Notes   :
## -- - Uses the built-in GITHUB_TOKEN instead of a personal access token
## -- - Tests the supported Python range across three operating systems:
## --     Ubuntu  : highest supported Python version
## --     Windows : medium supported Python version
## --     macOS   : lowest supported Python version
## -- - Dependency-file updates are committed automatically except for pull requests
## -------------------------------------------------------------------------------------------------
## -- History :
## -- yyyy-mm-dd  Ver.      Auth.    Description
## -- 2021        1.0.0     MRD      Creation
## -- 2024-10-09  1.1.0     DA       Updated the version range for Python to 3.10 - 3.12
## -- 2024-12-05  1.2.0     DA       Excluded source branch 'extension_hub_tmp' from execution
## -- 2024-12-10  1.3.0     DA       Updated actions/checkout to v4, actions/setup-python to v5
## -- 2025-04-24  1.4.0     DA       Removed Python 3.10
## -- 2026-08-18  2.0.0     DA       Various updates
## --                                - GITHUB_TOKEN
## --                                - Python version range to 3.12 - 3.14
## --                                - updated actions/checkout to v7
## --                                - updated actions/setup-python to v7
## -- 2026-08-22  2.1.0     DA       Acceleration and simplification
## --                                - Ubuntu: Python 3.14
## --                                - Windows: Python 3.13
## --                                - macOS: Python 3.12
## --                                - doc_test removed
## --                                - obsolete test matrix removed
## --                                - obsolete trigger_build logic removed
## --                                - write permission restricted to preparation job
## --                                - dependency auto-commit disabled for pull requests
## -------------------------------------------------------------------------------------------------

name: 1 Unit Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  schedule:
    - cron: '00 1 * * 1'

  workflow_dispatch:


permissions:
  contents: read


jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.head_ref != 'extension_hub_tmp' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate dependencies list
        run: |
          awk '/^[[]/{f=0} /full/{f=1;next} {sub(/^[ \t]+|[ \t]/, "")} f' setup.cfg \
          | tr -d "<" \
          | tr -d ">" \
          | tr -s "==" "," \
          > doc/rtd/content/01_welcome/sub/deps.txt

      - name: Commit dependency list if changed
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Dependencies Generation
          branch: ${{ github.ref_name }}
          commit_user_name: MLPro Administration
          commit_user_email: mlpro@listen.fh-swf.de


  ubuntu_test:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: make pytest


  windows_test:
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Test with pytest
        run: make pytest


  macos_test:
    runs-on: macos-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Test with pytest
        run: make pytest
