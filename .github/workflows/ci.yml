## -------------------------------------------------------------------------------------------------
## -- Project : MLPro - The integrative middleware framework for standardized machine learning
## -- Workflow: ci.yml.new
## -------------------------------------------------------------------------------------------------
## -- Notes   :
## -- - Uses the built-in GITHUB_TOKEN instead of a personal access token
## -- - Uses github.head_ref || github.ref_name for branch-aware execution
## -- - Keeps tests running even after an automatic dependency-file commit
## -------------------------------------------------------------------------------------------------
## -- History :
## -- yyyy-mm-dd  Ver.      Auth.    Description
## -- 2021        1.0.0     MRD      Creation 
## -- 2024-10-09  1.1.0     DA       Updated the version range for Python to 3.10 - 3.12
## -- 2024-12-05  1.2.0     DA       Excluded source branch 'extension_hub_tmp' from execution
## -- 2024-12-10  1.3.0     DA       Update actions/checkout to v4, actions/setup-python to v5
## -- 2025-04-24  1.4.0     DA       Removed Python 3.10
## -- 2026-08-18  2.0.0     DA       Various updates
## --                                - GITHUB_TOKEN 
## --                                - Python version range to 3.12 - 3.14
## --                                - updated actions/checkout@v4 to actions/checkout@v7
## --                                - updated actions/setup-python@v5 to actions/setup-python@v7
## -------------------------------------------------------------------------------------------------

name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '00 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deps_gen:
    runs-on: ubuntu-latest
    if: ${{ github.head_ref != 'extension_hub_tmp' }}
    outputs:
      trigger_build: ${{ steps.trigger_build.outputs.build }}

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate dependencies list
        run: |
          awk '/^[[]/{f=0} /full/{f=1;next} {sub(/^[ \t]+|[ \t]/, "")} f' setup.cfg \
          | tr -d "<" \
          | tr -d ">" \
          | tr -s "==" "," \
          > doc/rtd/content/01_welcome/sub/deps.txt

      - name: Commit dependency list if changed
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Dependencies Generation
          branch: ${{ github.head_ref || github.ref_name }}
          commit_user_name: MLPro Administration
          commit_user_email: mlpro@listen.fh-swf.de

      - name: Trigger tests
        id: trigger_build
        run: echo "build=true" >> "$GITHUB_OUTPUT"


  ubuntu_test:
    runs-on: ubuntu-latest
    needs: deps_gen
    if: needs.deps_gen.outputs.trigger_build == 'true'

    strategy:
      matrix:
        python-version: ['3.12', '3.14']  # first and last supported Python version only

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: make pytest


  doc_test:
    runs-on: ubuntu-latest
    needs: deps_gen
    if: needs.deps_gen.outputs.trigger_build == 'true'

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
          pip install sphinx sphinx-rtd-theme sphinx-copybutton sphinx_multitoc_numbering ablog

      - name: Build the Documentation
        run: make docu


  windows_test:
    runs-on: windows-latest
    needs: deps_gen
    if: needs.deps_gen.outputs.trigger_build == 'true'

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Test with pytest
        run: make pytest


  macos_test:
    runs-on: macos-latest
    needs: deps_gen
    if: needs.deps_gen.outputs.trigger_build == 'true'

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Test with pytest
        run: make pytest