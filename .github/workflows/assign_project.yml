name: Assign project to new issue

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Assign project to new issue
    runs-on: ubuntu-latest

    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/blueaic/projects/21
          github-token: ${{ secrets.ISSUE_UPDATES }}